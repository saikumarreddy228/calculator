<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <input type="text" readonly>
    <div class="buttons">
      <button class="btn" onclick="ClearAllValues()">C</button>
      <button class="btn" onclick="del()">DEL</button>
      <button class="btn" onclick="UserInputValue('/')">/</button>
      <button class="btn" onclick="UserInputValue('%')">%</button>

      <button class="btn" onclick="UserInputValue('7')">7</button>
      <button class="btn" onclick="UserInputValue('8')">8</button>
      <button class="btn" onclick="UserInputValue('9')">9</button>
      <button class="btn" onclick="UserInputValue('*')">*</button>

      <button class="btn" onclick="UserInputValue('4')">4</button>
      <button class="btn" onclick="UserInputValue('5')">5</button>
      <button class="btn" onclick="UserInputValue('6')">6</button>
      <button class="btn" onclick="UserInputValue('-')">-</button>

      <button class="btn" onclick="UserInputValue('1')">1</button>
      <button class="btn" onclick="UserInputValue('2')">2</button>
      <button class="btn" onclick="UserInputValue('3')">3</button>
      <button class="btn " onclick="UserInputValue('+')">+</button>
      

      <button class="btn " onclick="UserInputValue('0')">0</button>
      <button class="btn" onclick="UserInputValue('00')">00</button>
      <button class="btn" onclick="UserInputValue('.')">.</button>
      <button class="btn equal" onclick="equal()" class="equal">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
